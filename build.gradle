// Nvidiator Android: an unofficial, experimental port of NVDA's sound and feel to Android.
// Not affiliated with or endorsed by NV Access. GPL v2, like NVDA.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.0'
        // Chaquopy runs NVDA's Python modules (controlTypes, characterProcessing...) inside the app.
        classpath 'com.chaquo.python:gradle:17.2.0'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

def localProps = new Properties()
def lp = file('local.properties')
if (lp.exists()) { lp.withInputStream { localProps.load(it) } }

android {
    compileSdk = 36
    namespace = "com.irondonkey.nvidiator"

    defaultConfig {
        applicationId = "com.irondonkey.nvidiator"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0-experimental"
        ndk {
            // Python 3.11 is the last Python Chaquopy builds for 32-bit phones.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // One APK per chip type, plus a universal APK.
    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
        jniLibs {
            // Chaquopy's Python libraries are unpacked at install time, like extractNativeLibs.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        // Python 3.11 on the build machine compiles NVDA's modules to bytecode. Set
        // python.build in local.properties if python3.11 is not on your PATH.
        def bp = localProps.getProperty('python.build')
        if (bp) { buildPython(bp) }
    }
}
